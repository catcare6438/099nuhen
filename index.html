<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>貓窩裏 · 保母行事曆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--surface:#fff;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --text:#1a1a18;--text2:#5f5e5a;--text3:#999;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-dk:#085041;
  --r8:8px;--r12:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1a;--surface:#252523;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--text:#f0efea;--text2:#b4b2a9;--text3:#666;--green-bg:#04342C;--green-dk:#9FE1CB}
}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.hdr-left h1{font-size:17px;font-weight:600}
.hdr-left p{font-size:12px;color:var(--text2);margin-top:2px}
.btn-add{display:flex;align-items:center;gap:5px;background:var(--green);color:#fff;border:none;border-radius:var(--r8);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav-mid{font-size:15px;font-weight:600;text-align:center}
.btn-nav{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r8);padding:8px 13px;font-size:16px;cursor:pointer;color:var(--text)}
.btn-today{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r8);padding:8px 12px;font-size:13px;cursor:pointer;color:var(--text)}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.wk-cell{text-align:center;font-size:11px;color:var(--text3);padding:3px 0;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{background:var(--surface);border:0.5px solid var(--border);border-radius:6px;padding:4px 3px;min-height:64px;cursor:pointer;overflow:hidden}
.day:active{background:var(--bg)}
.day.other{background:var(--bg);opacity:.45;cursor:default}
.day.today .dn{background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.dn{font-size:11px;font-weight:600;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.dot-wrap{display:flex;flex-direction:column;gap:1px}
.dot{font-size:9px;padding:1px 3px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#085041;background:#9FE1CB;line-height:1.5}
.dot.walk{background:#B5D4F4;color:#0C447C}
.dot.visit{background:#FAC775;color:#633806}
.dot.bath{background:#F4C0D1;color:#72243E}
.dot.oth{background:#D3D1C7;color:#444}
.dot-more{font-size:9px;color:var(--text3);padding:1px 2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:520px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:16px}
@media(min-width:520px){.sheet{border-radius:var(--r12);width:480px}}
.handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtitle{font-size:16px;font-weight:600}
.btn-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1;padding:2px 6px;border-radius:6px}
.arow{border:0.5px solid var(--border);border-radius:var(--r8);padding:11px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.ainfo{flex:1;min-width:0}
.atime{font-size:11px;color:var(--text2);margin-bottom:3px}
.aname-btn{background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#185FA5;padding:0;text-align:left;font-family:inherit}
.tpill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:5px}
.tp-cat{background:#9FE1CB;color:#085041}
.tp-dog{background:#B5D4F4;color:#0C447C}
.tp-vis{background:#FAC775;color:#633806}
.tp-bath{background:#F4C0D1;color:#72243E}
.tp-etc{background:#D3D1C7;color:#444}
.apet{font-size:12px;color:var(--text2);margin-top:2px}
.acol{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.btn-sm{background:var(--surface);border:0.5px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.btn-sm-del{background:none;border:0.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#A32D2D}
.cbadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--green-bg);color:var(--green-dk);border-radius:var(--r8);padding:4px 10px;margin-bottom:8px}
.alert-box{border-left:3px solid #EF9F27;background:#FAEEDA;color:#633806;border-radius:0 var(--r8) var(--r8) 0;padding:9px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
.note-box{background:var(--bg);border-radius:var(--r8);padding:9px 12px;font-size:13px;color:var(--text2);line-height:1.6}
.slabel{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;margin-top:8px}
.addr-row{font-size:13px;color:var(--text2);margin-bottom:8px}
.fg{margin-bottom:11px}
.fl{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:500}
.fi{width:100%;border:0.5px solid var(--border2);border-radius:var(--r8);padding:9px 11px;font-size:14px;color:var(--text);background:var(--surface);font-family:inherit}
.fi:focus{outline:none;border-color:var(--green)}
textarea.fi{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{width:100%;background:var(--green);color:#fff;border:none;border-radius:var(--r8);padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-add-inline{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--green-bg);color:var(--green-dk);border:0.5px dashed var(--green);border-radius:var(--r8);padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:24px 0}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>&#128062; 貓窩裏保母行事曆</h1>
    <p>到府寵物服務管理</p>
  </div>
  <button class="btn-add" onclick="openAdd()">&#xff0b; 新增行程</button>
</div>

<div class="nav">
  <div style="display:flex;gap:5px">
    <button class="btn-nav" onclick="changeMonth(-1)">&#8249;</button>
    <button class="btn-nav" onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="nav-mid" id="mlabel"></div>
  <button class="btn-today" onclick="goToday()">今天</button>
</div>

<div class="wk-row">
  <div class="wk-cell">日</div><div class="wk-cell">一</div>
  <div class="wk-cell">二</div><div class="wk-cell">三</div>
  <div class="wk-cell">四</div><div class="wk-cell">五</div>
  <div class="wk-cell">六</div>
</div>
<div class="cal" id="cal"></div>

<div class="overlay" id="dayOv">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mhdr">
      <span class="mtitle" id="dayTitle"></span>
      <button class="btn-x" onclick="closeOv('dayOv')">&#215;</button>
    </div>
    <div id="dayList"></div>
    <button class="btn-add-inline" onclick="closeOv('dayOv');openAdd()">&#xff0b; 新增行程</button>
  </div>
</div>

<div class="overlay" id="clientOv">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mhdr">
      <span class="mtitle" id="clientTitle"></span>
      <button class="btn-x" onclick="closeOv('clientOv')">&#215;</button>
    </div>
    <div id="clientBody"></div>
  </div>
</div>

<div class="overlay" id="formOv">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mhdr">
      <span class="mtitle" id="formTitle">新增行程</span>
      <button class="btn-x" onclick="closeOv('formOv')">&#215;</button>
    </div>
    <div class="fg"><label class="fl">日期</label><input type="date" class="fi" id="fDate"></div>
    <div class="frow">
      <div class="fg"><label class="fl">時間</label><input type="time" class="fi" id="fTime"></div>
      <div class="fg"><label class="fl">服務類型</label>
        <select class="fi" id="fType">
          <option>顧貓</option><option>遛狗</option><option>家訪</option><option>洗澡</option><option>其他</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">客戶姓名</label><input type="text" class="fi" id="fName" placeholder="例：王小姐"></div>
    <div class="fg"><label class="fl">服務地址</label><input type="text" class="fi" id="fAddr" placeholder="高雄市○○區…"></div>
    <div class="fg"><label class="fl">寵物名稱／種類</label><input type="text" class="fi" id="fPet" placeholder="例：橘子（橘貓）"></div>
    <div class="fg"><label class="fl">&#9888; 須注意事項</label><textarea class="fi" id="fAlert" placeholder="例：需每天吃藥、怕陌生人…"></textarea></div>
    <div class="fg"><label class="fl">備註</label><textarea class="fi" id="fNote" placeholder="其他補充…"></textarea></div>
    <button class="btn-save" onclick="saveAppt()">&#10003; 儲存行程</button>
  </div>
</div>

<script>
var TODAY=new Date(),cY=TODAY.getFullYear(),cM=TODAY.getMonth()+1,editId=null;
var MN=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

var appts=[
  {id:1,date:'2026-05-23',time:'09:00',type:'家訪',name:'王小姐',addr:'高雄市鼓山區某路1號',pet:'小白（波斯貓）',alert:'怕噪音，進門請輕聲',note:'鑰匙在信箱'},
  {id:2,date:'2026-05-23',time:'11:00',type:'顧貓',name:'李先生',addr:'高雄市左營區某街22號',pet:'咖啡（美國短毛貓）',alert:'需每天吃腎臟病藥一顆',note:'飼料在廚房上方'},
  {id:3,date:'2026-05-23',time:'14:00',type:'遛狗',name:'黃小姐',addr:'高雄市三民區某路8號',pet:'花生（柴犬）',alert:'見到其他狗會衝，請抓緊牽繩',note:'散步約30分鐘'},
  {id:4,date:'2026-05-26',time:'10:00',type:'顧貓',name:'陳太太',addr:'高雄市新興區某路5號',pet:'豆腐（布偶貓）',alert:'剛結紮，傷口需觀察',note:''},
  {id:5,date:'2026-05-28',time:'09:30',type:'洗澡',name:'林小姐',addr:'高雄市苓雅區某路3號',pet:'芒果（金毛獵犬）',alert:'怕吹風機聲音',note:'只用指定沐浴乳'}
];
var nid=6;

function pad(n){return String(n).padStart(2,'0')}
function ds(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}

function typeClass(t){
  return t==='遛狗'?'walk':t==='家訪'?'visit':t==='洗澡'?'bath':t==='其他'?'oth':'';
}
function typePill(t){
  var c=t==='顧貓'?'cat':t==='遛狗'?'dog':t==='家訪'?'vis':t==='洗澡'?'bath':'etc';
  return '<span class="tpill tp-'+c+'">'+t+'</span>';
}

function render(){
  document.getElementById('mlabel').textContent=cY+'年 '+MN[cM-1];
  var grid=document.getElementById('cal');
  grid.innerHTML='';
  var first=new Date(cY,cM-1,1).getDay();
  var days=new Date(cY,cM,0).getDate();
  var prev=new Date(cY,cM-1,0).getDate();
  var cells=[];
  for(var i=0;i<first;i++) cells.push({d:prev-first+1+i,cur:false});
  for(var d=1;d<=days;d++) cells.push({d:d,cur:true});
  var rem=(7-cells.length%7)%7;
  for(var j=1;j<=rem;j++) cells.push({d:j,cur:false});

  cells.forEach(function(c){
    var dateS=c.cur?ds(cY,cM,c.d):'';
    var da=c.cur?appts.filter(function(a){return a.date===dateS}).sort(function(a,b){return a.time.localeCompare(b.time)}):[];
    var isT=c.cur&&cY===TODAY.getFullYear()&&cM===TODAY.getMonth()+1&&c.d===TODAY.getDate();
    var el=document.createElement('div');
    el.className='day'+(c.cur?'':' other')+(isT?' today':'');
    if(c.cur){(function(s,dd){el.onclick=function(){openDay(s,dd)}})(dateS,c.d);}
    var dn=document.createElement('div');
    dn.className='dn'; dn.textContent=c.d; el.appendChild(dn);
    var dw=document.createElement('div'); dw.className='dot-wrap';
    da.slice(0,3).forEach(function(a){
      var dot=document.createElement('div');
      dot.className='dot '+typeClass(a.type);
      dot.textContent=a.time+' '+a.name;
      dw.appendChild(dot);
    });
    if(da.length>3){var m=document.createElement('div');m.className='dot-more';m.textContent='+'+( da.length-3);dw.appendChild(m);}
    el.appendChild(dw);
    grid.appendChild(el);
  });
}

function changeMonth(d){cM+=d;if(cM>12){cM=1;cY++;}if(cM<1){cM=12;cY--;}render();}
function goToday(){cY=TODAY.getFullYear();cM=TODAY.getMonth()+1;render();}

function openDay(dateS,d){
  document.getElementById('dayTitle').textContent=cY+'年'+MN[cM-1]+d+'日';
  var list=document.getElementById('dayList');
  var da=appts.filter(function(a){return a.date===dateS}).sort(function(a,b){return a.time.localeCompare(b.time)});
  if(!da.length){list.innerHTML='<div class="empty">今天尚無行程</div>';openOv('dayOv');return;}
  list.innerHTML=da.map(function(a){
    return '<div class="arow">'+
      '<div class="ainfo">'+
        '<div class="atime">'+a.time+'</div>'+
        '<div><button class="aname-btn" onclick="openClient('+a.id+')">'+a.name+'</button>'+typePill(a.type)+'</div>'+
        (a.pet?'<div class="apet">&#128062; '+a.pet+'</div>':'')+
      '</div>'+
      '<div class="acol">'+
        '<button class="btn-sm" onclick="closeOv(\'dayOv\');openEdit('+a.id+')">編輯</button>'+
        '<button class="btn-sm-del" onclick="delAppt('+a.id+')">刪除</button>'+
      '</div>'+
    '</div>';
  }).join('');
  openOv('dayOv');
}

function openClient(id){
  var a=appts.find(function(x){return x.id===id});if(!a)return;
  document.getElementById('clientTitle').textContent=a.name+' · 客戶資料';
  document.getElementById('clientBody').innerHTML=
    '<div class="cbadge">&#128062; '+(a.pet||'未填寫')+'</div>'+
    (a.addr?'<div class="addr-row">&#128205; '+a.addr+'</div>':'')+
    (a.alert?'<div class="slabel">&#9888; 須注意事項</div><div class="alert-box">'+a.alert+'</div>':'')+
    (a.note?'<div class="slabel">備註</div><div class="note-box">'+a.note+'</div>':'')+
    (!a.alert&&!a.note?'<div class="empty">尚無備註資料</div>':'')+
    '<button class="btn-sm" style="width:100%;margin-top:12px;padding:10px" onclick="closeOv(\'clientOv\');openEdit('+a.id+')">&#9998; 編輯此行程</button>';
  openOv('clientOv');
}

function openAdd(){
  editId=null;
  document.getElementById('formTitle').textContent='新增行程';
  document.getElementById('fDate').value=ds(TODAY.getFullYear(),TODAY.getMonth()+1,TODAY.getDate());
  document.getElementById('fTime').value='09:00';
  document.getElementById('fType').value='顧貓';
  ['fName','fAddr','fPet','fAlert','fNote'].forEach(function(i){document.getElementById(i).value='';});
  openOv('formOv');
}

function openEdit(id){
  editId=id;var a=appts.find(function(x){return x.id===id});if(!a)return;
  document.getElementById('formTitle').textContent='編輯行程';
  document.getElementById('fDate').value=a.date;
  document.getElementById('fTime').value=a.time;
  document.getElementById('fType').value=a.type;
  document.getElementById('fName').value=a.name;
  document.getElementById('fAddr').value=a.addr||'';
  document.getElementById('fPet').value=a.pet||'';
  document.getElementById('fAlert').value=a.alert||'';
  document.getElementById('fNote').value=a.note||'';
  openOv('formOv');
}

function saveAppt(){
  var date=document.getElementById('fDate').value;
  var time=document.getElementById('fTime').value;
  var name=document.getElementById('fName').value.trim();
  if(!date||!time||!name){alert('請填寫日期、時間和客戶姓名');return;}
  var appt={
    id:editId||nid++,date:date,time:time,
    type:document.getElementById('fType').value,name:name,
    addr:document.getElementById('fAddr').value.trim(),
    pet:document.getElementById('fPet').value.trim(),
    alert:document.getElementById('fAlert').value.trim(),
    note:document.getElementById('fNote').value.trim()
  };
  if(editId){var i=appts.findIndex(function(a){return a.id===editId});if(i>-1)appts[i]=appt;}
  else appts.push(appt);
  closeOv('formOv');
  var parts=date.split('-');cY=+parts[0];cM=+parts[1];render();
}

function delAppt(id){
  if(!confirm('確定刪除這個行程？'))return;
  appts=appts.filter(function(a){return a.id!==id});
  closeOv('dayOv');render();
}

function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});
});

render();
</script>
</body>
</html>
