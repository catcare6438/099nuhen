<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>窩貓裏 - 貓咪到府保母行程管理</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- 導覽列 -->
    <header class="bg-emerald-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fas fa-cat text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">窩貓裏｜到府保母行程管理</h1>
        </div>
        <div class="text-sm bg-emerald-700 px-3 py-1 rounded-full">管理後台</div>
    </header>

    <!-- 主區塊 -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：日曆表 (佔 2 欄) -->
        <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-700" id="currentMonthYear">2026 年 5 月</h2>
                <div class="flex space-x-2">
                    <button class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition" onclick="prevMonth()"><i class="fas fa-chevron-left"></i></button>
                    <button class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- 星期標頭 -->
            <div class="grid grid-cols-7 gap-2 text-center font-semibold text-slate-500 mb-2">
                <div class="text-red-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-sky-500">六</div>
            </div>

            <!-- 日曆格子 -->
            <div class="grid grid-cols-7 gap-2" id="calendarGrid"></div>
        </section>

        <!-- 右側：詳細時間與行程 (佔 1 欄) -->
        <section class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 flex flex-col justify-between min-h-[500px]">
            <div>
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-xl font-bold text-slate-700" id="selectedDateTitle">請選擇日期</h3>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded" id="totalJobs">無行程</span>
                </div>

                <!-- 行程時間軸列表 -->
                <div class="space-y-4" id="timelineList">
                    <div class="text-center py-12 text-slate-400">
                        <i class="fas fa-pointer text-3xl mb-2 block animate-bounce"></i>
                        <p class="text-sm">請點擊左側日曆查看當天行程</p>
                    </div>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <button onclick="openAddBookingModal()" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fas fa-plus"></i>
                <span>新增此日預約行程</span>
            </button>
        </section>
    </main>

    <!-- 視窗 1：檢視詳細備註與注意事項 (Modal) -->
    <div id="customerModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden transform scale-95 transition-transform duration-150">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fas fa-clipboard-list text-emerald-400"></i>
                    <span>客戶行程詳情：<span id="modalCustomerName">--</span></span>
                </h3>
                <button onclick="closeModal('customerModal')" class="text-slate-400 hover:text-white transition text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-1">負責貓咪</h4>
                    <p id="modalCatDetails" class="text-base font-semibold text-slate-800">--</p>
                </div>
                
                <!-- 💡 本次行程特交事項 -->
                <div id="modalJobNotesContainer" class="hidden">
                    <hr class="border-slate-100 my-2">
                    <h4 class="text-xs font-bold text-amber-600 tracking-wider uppercase mb-1"><i class="fas fa-star mr-1"></i>本次行程特別備註</h4>
                    <p id="modalJobNotes" class="text-sm font-medium text-slate-700 bg-amber-50 border border-amber-200 p-3 rounded-xl whitespace-pre-line">--</p>
                </div>

                <hr class="border-slate-100">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">常態注意事項 (環境/鑰匙/餵食)</h4>
                    <div id="modalCustomerNotes" class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-xl whitespace-pre-line border border-slate-100"></div>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-4 flex justify-end">
                <button onclick="closeModal('customerModal')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">關閉</button>
            </div>
        </div>
    </div>

    <!-- 視窗 2：新增行程彈跳視窗（含行程備註欄位） -->
    <div id="addBookingModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden transform scale-95 transition-transform duration-150">
            <div class="bg-emerald-600 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fas fa-calendar-plus"></i>
                    <span>新增預約行程</span>
                </h3>
                <button onclick="closeModal('addBookingModal')" class="text-emerald-200 hover:text-white transition text-xl"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">預約日期</label>
                    <input type="date" id="formDate" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">開始時間</label>
                        <input type="time" id="formStartTime" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">結束時間</label>
                        <input type="time" id="formEndTime" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">選擇貓主</label>
                    <select id="formCustomerSelect" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 bg-white">
                        <option value="0">王小明 (貓咪：麻糬)</option>
                        <option value="1">林大華 (貓咪：QQ & 咪咪)</option>
                        <option value="2">陳小姐 (貓咪：肉丸)</option>
                    </select>
                </div>
                
                <!-- 💡 新增的行程特殊注意事項輸入框 -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">本次行程注意事項 / 特殊備註</label>
                    <textarea id="formJobNotes" placeholder="例如：本次需幫忙收信、加餵感冒藥、回報水流量狀況..." rows="3" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('addBookingModal')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">取消</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm cursor-pointer">確認新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 前端核心邏輯 -->
    <script>
        const mockCustomers = [
            { name: "王小明", cat_details: "麻糬 (2歲橘貓)", notes: "🔑 鑰匙位置：大門地墊下密碼盒（密碼 5678）\n🍲 餵食：半罐主食罐 + 1/3量米杯飼料。\n💊 醫療：需餵半顆化毛膏。" },
            { name: "林大華", cat_details: "QQ & 咪咪 (多貓家庭)", notes: "🔑 鑰匙：大樓管理室代收\n🍲 餵食：QQ 吃處方飼料，咪咪吃一般乾乾（需分開房間餵）。" },
            { name: "陳小姐", cat_details: "肉丸 (5歲美短)", notes: "🔑 鑰匙：信箱轉盤密碼 0314。\n🍲 餵食：純全乾乾（半杯）。" }
        ];

        const mockBookings = [
            { id: "b1", service_date: "2026-05-02", start_time: "10:00", end_time: "11:00", status: "已確認", job_notes: "今天出門前屋主說客廳除濕機水滿了，記得順便幫忙倒水唷！", customers: mockCustomers[0] },
            { id: "b2", service_date: "2026-05-02", start_time: "16:30", end_time: "17:30", status: "已確認", job_notes: "林先生說這幾天郵差會送貓砂，若遇到管理室代收，請幫忙搬進玄關。", customers: mockCustomers[1] },
            { id: "b3", service_date: "2026-05-15", start_time: "13:00", end_time: "14:00", status: "待確認", job_notes: "", customers: mockCustomers[2] }
        ];

        let currentYear = 2026;
        let currentMonth = 5; 
        let selectedDateStr = "2026-05-02";

        function renderCalendar(year, month) {
            document.getElementById('currentMonthYear').innerText = `${year} 年 ${month} 月`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();
            const prevTotalDays = new Date(year, month - 1, 0).getDate();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = "h-24 p-2 bg-slate-50 text-slate-300 rounded-xl text-right text-xs";
                dayDiv.innerText = prevTotalDays - i;
                grid.appendChild(dayDiv);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayBookings = mockBookings.filter(b => b.service_date === dateStr);
                const hasEvent = dayBookings.length > 0;

                const dayDiv = document.createElement('div');
                let baseClass = "h-24 p-2 border rounded-xl text-right text-sm cursor-pointer relative transition group ";
                if (dateStr === selectedDateStr) {
                    baseClass += "border-emerald-600 bg-emerald-50/50 ring-2 ring-emerald-600/20";
                } else if (hasEvent) {
                    baseClass += "border-emerald-200 bg-emerald-50/10 hover:bg-emerald-50";
                } else {
                    baseClass += "border-slate-100 hover:border-slate-300 bg-white";
                }
                dayDiv.className = baseClass;
                dayDiv.innerHTML = `<span>${day}</span>`;
                
                if (hasEvent) {
                    const badge = document.createElement('div');
                    badge.className = "absolute bottom-2 left-2 right-2 text-left bg-emerald-600 text-white text-[10px] p-1 rounded truncate shadow-xs md:block hidden";
                    badge.innerHTML = `<i class="fas fa-clock mr-0.5"></i> ${dayBookings.length} 預約`;
                    dayDiv.appendChild(badge);

                    const dot = document.createElement('div');
                    dot.className = "absolute bottom-2 right-2 w-2 h-2 bg-emerald-600 rounded-full md:hidden";
                    dayDiv.appendChild(dot);
                }

                dayDiv.onclick = () => selectDate(dateStr);
                grid.appendChild(dayDiv);
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(currentYear, currentMonth);

            const [y, m, d] = dateStr.split('-');
            document.getElementById('selectedDateTitle').innerText = `${parseInt(m)} 月 ${parseInt(d)} 日 行程`;
            
            const list = document.getElementById('timelineList');
            const totalJobs = document.getElementById('totalJobs');
            const dayBookings = mockBookings.filter(b => b.service_date === dateStr);

            if (dayBookings.length === 0) {
                totalJobs.innerText = "無行程";
                totalJobs.className = "text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded";
                list.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fas fa-calendar-minus text-4xl mb-2 block text-slate-300"></i>
                        <p class="text-sm">這天目前沒有排定的貓咪到府行程喔！</p>
                    </div>
                `;
                return;
            }

            totalJobs.innerText = `共 ${dayBookings.length} 場`;
            totalJobs.className = "text-xs bg-emerald-600 text-white px-2 py-1 rounded-full font-medium";
            dayBookings.sort((a, b) => a.start_time.localeCompare(b.start_time));

            list.innerHTML = '';
            dayBookings.forEach((booking) => {
                const card = document.createElement('div');
                card.className = `border-l-4 border-emerald-500 bg-slate-50 p-4 rounded-r-xl shadow-xs hover:shadow-md transition`;
                
                // 檢查是否有特別交辦的 job_notes，有的話在右側時間軸預覽一下
                const jobNotesPreview = booking.job_notes 
                    ? `<div class="mt-2 text-xs bg-amber-50 text-amber-800 border border-amber-100 p-2 rounded-lg truncate"><i class="fas fa-exclamation-circle text-amber-500 mr-1"></i>當日備註：${booking.job_notes}</div>` 
                    : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2 py-1 rounded-md">
                            <i class="far fa-clock mr-1"></i>${booking.start_time} - ${booking.end_time}
                        </span>
                        <span class="text-xs text-slate-400 font-medium">${booking.status}</span>
                    </div>
                    <h4 class="font-bold text-base mt-2 text-slate-800">
                        貓主：<span class="text-emerald-600 underline cursor-pointer hover:text-emerald-700 underline-offset-4" 
                              onclick="openCustomerModal('${booking.id}')">
                              ${booking.customers.name}
                            </span>
                    </h4>
                    <p class="text-xs text-slate-500 mt-1 flex items-center">
                        <i class="fas fa-paw text-slate-400 mr-1"></i>${booking.customers.cat_details}
                    </p>
                    ${jobNotesPreview}
                `;
                list.appendChild(card);
            });
        }

        // 打開備註檢視彈窗 (兩種類型的備註都會出現在這)
        function openCustomerModal(bookingId) {
            const booking = mockBookings.find(b => b.id === bookingId);
            if(!booking) return;
            
            const modal = document.getElementById('customerModal');
            document.getElementById('modalCustomerName').innerText = booking.customers.name;
            document.getElementById('modalCatDetails').innerText = booking.customers.cat_details;
            document.getElementById('modalCustomerNotes').innerText = booking.customers.notes;
            
            // 處理本次行程的特別備註顯示邏輯
            const jobNotesContainer = document.getElementById('modalJobNotesContainer');
            if (booking.job_notes && booking.job_notes.trim() !== "") {
                document.getElementById('modalJobNotes').innerText = booking.job_notes;
                jobNotesContainer.classList.remove('hidden');
            } else {
                jobNotesContainer.classList.add('hidden');
            }
            
            showModal(modal);
        }

        function openAddBookingModal() {
            const modal = document.getElementById('addBookingModal');
            document.getElementById('formDate').value = selectedDateStr;
            showModal(modal);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const date = document.getElementById('formDate').value;
            const startTime = document.getElementById('formStartTime').value;
            const endTime = document.getElementById('formEndTime').value;
            const customerIndex = document.getElementById('formCustomerSelect').value;
            const jobNotes = document.getElementById('formJobNotes').value; // 抓取新增的備註

            const newBooking = {
                id: "b_" + Date.now(),
                service_date: date,
                start_time: startTime,
                end_time: endTime,
                status: "已確認",
                job_notes: jobNotes, // 把新備註寫入行程物件
                customers: mockCustomers[customerIndex]
            };

            mockBookings.push(newBooking);
            closeModal('addBookingModal');
            
            // 清空表單欄位
            document.getElementById('formStartTime').value = '';
            document.getElementById('formEndTime').value = '';
            document.getElementById('formJobNotes').value = '';

            selectedDateStr = date;
            const [y, m] = date.split('-');
            currentYear = parseInt(y);
            currentMonth = parseInt(m);

            selectDate(date);
        }

        function showModal(modalNode) {
            modalNode.classList.remove('hidden');
            setTimeout(() => { modalNode.firstElementChild.classList.remove('scale-95'); }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 150);
        }

        function prevMonth() {
            currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        }
        function nextMonth() {
            currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        }

        window.onload = () => {
            renderCalendar(currentYear, currentMonth);
            selectDate(selectedDateStr);
        }
    </script>
</body>
</html>
