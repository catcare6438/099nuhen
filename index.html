<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>窩貓裏 - 貓咪到府保母行事曆</title>
    <!-- 引入 Tailwind CSS 方便快速美化 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- 導覽列 -->
    <header class="bg-emerald-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fas fa-cat text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">窩貓裏｜到府保母行程管理</h1>
        </div>
        <div class="text-sm bg-emerald-700 px-3 py-1 rounded-full">管理後台</div>
    </header>

    <!-- 主區塊 -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：日曆表 (佔 2 欄) -->
        <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-700" id="currentMonthYear">2026 年 5 月</h2>
                <div class="flex space-x-2">
                    <button class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fas fa-chevron-left"></i></button>
                    <button class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- 星期標頭 -->
            <div class="grid grid-cols-7 gap-2 text-center font-semibold text-slate-500 mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>

            <!-- 日曆格子 (示範 5 月份部分日期) -->
            <div class="grid grid-cols-7 gap-2" id="calendarGrid">
                <!-- 模擬空天數 (4/26~4/30) -->
                <div class="h-24 p-2 bg-slate-50 text-slate-400 rounded-xl text-right text-sm">26</div>
                <div class="h-24 p-2 bg-slate-50 text-slate-400 rounded-xl text-right text-sm">27</div>
                <div class="h-24 p-2 bg-slate-50 text-slate-400 rounded-xl text-right text-sm">28</div>
                <div class="h-24 p-2 bg-slate-50 text-slate-400 rounded-xl text-right text-sm">29</div>
                <div class="h-24 p-2 bg-slate-50 text-slate-400 rounded-xl text-right text-sm">30</div>
                
                <!-- 5/1 -->
                <div onclick="selectDate(1)" class="h-24 p-2 border border-slate-100 hover:border-emerald-500 bg-white rounded-xl text-right text-sm cursor-pointer relative transition">
                    1
                </div>
                <!-- 5/2 (有行程範例) -->
                <div onclick="selectDate(2)" class="h-24 p-2 border border-emerald-200 bg-emerald-5/30 hover:bg-emerald-50 rounded-xl text-right text-sm cursor-pointer relative transition ring-2 ring-emerald-500/20">
                    2
                    <div class="absolute bottom-2 left-2 right-2 text-left bg-emerald-600 text-white text-[10px] p-1 rounded truncate shadow-sm">
                        <i class="fas fa-clock"></i> 2 檔預約
                    </div>
                </div>
                <!-- 5/3 -->
                <div onclick="selectDate(3)" class="h-24 p-2 border border-slate-100 hover:border-emerald-500 bg-white rounded-xl text-right text-sm cursor-pointer relative transition">
                    3
                </div>
                <!-- 補齊其他日子的示意 -->
                <script>
                    for(let i=4; i<=31; i++) {
                        let hasEvent = i === 15 || i === 20; // 模擬其他有行程的日子
                        document.write(`
                            <div onclick="selectDate(${i})" class="h-24 p-2 border ${hasEvent ? 'border-amber-200 bg-amber-5/30' : 'border-slate-100'} hover:border-emerald-500 bg-white rounded-xl text-right text-sm cursor-pointer relative transition">
                                ${i}
                                ${hasEvent ? `<div class="absolute bottom-2 left-2 right-2 text-left bg-amber-500 text-white text-[10px] p-1 rounded truncate">1 檔預約</div>` : ''}
                            </div>
                        `);
                    }
                </script>
            </div>
        </section>

        <!-- 右側：詳細時間與行程 (佔 1 欄) -->
        <section class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-xl font-bold text-slate-700" id="selectedDateTitle">5 月 2 日 行程詳細</h3>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded" id="totalJobs">共 2 場</span>
                </div>

                <!-- 行程列表 -->
                <div class="space-y-4" id="timelineList">
                    <!-- 卡片 1 -->
                    <div class="border-l-4 border-emerald-500 bg-slate-50 p-4 rounded-r-xl shadow-xs">
                        <div class="flex justify-between items-start">
                            <span class="text-sm font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full"><i class="far fa-clock mr-1"></i>10:00 - 11:00</span>
                            <span class="text-xs text-slate-400">已確認</span>
                        </div>
                        <h4 class="font-bold text-base mt-2 text-slate-800">
                            貓主：<span class="text-emerald-600 underline cursor-pointer hover:text-emerald-800" onclick="openModal('王小明', '貓咪：麻糬 (2歲橘貓)<br>🔑 鑰匙位置：大門地墊下密碼盒（密碼 5678）<br>🍲 餵食：半罐主食罐 + 1/3量米杯飼料，飼料需泡水。<br>💊 醫療：需餵半顆化毛膏（混在罐頭裡）。<br>⚠️ 注意：麻糬很害羞，進門先呼喚牠名字，不要強抱。')">王小明</span> (麻糬)
                        </h4>
                        <p class="text-xs text-slate-500 mt-1"><i class="fas fa-map-marker-alt text-slate-400 mr-1"></i>高雄市前鎮區...（點擊名字看細節）</p>
                    </div>

                    <!-- 卡片 2 -->
                    <div class="border-l-4 border-amber-500 bg-slate-50 p-4 rounded-r-xl shadow-xs">
                        <div class="flex justify-between items-start">
                            <span class="text-sm font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full"><i class="far fa-clock mr-1"></i>16:30 - 17:30</span>
                            <span class="text-xs text-slate-400">已確認</span>
                        </div>
                        <h4 class="font-bold text-base mt-2 text-slate-800">
                            貓主：<span class="text-amber-600 underline cursor-pointer hover:text-amber-800" onclick="openModal('林大華', '貓咪：QQ & 咪咪 (多貓家庭)<br>🔑 鑰匙：大樓管理室代收（已通知管理員）<br>🍲 餵食：QQ 吃處方飼料，咪咪吃一般乾乾（兩隻要分開房間餵，否則會搶食）。<br>🧹 清理：後陽台松木砂盆需篩，大便丟垃圾桶。')">林大華</span> (QQ/咪咪)
                        </h4>
                        <p class="text-xs text-slate-500 mt-1"><i class="fas fa-map-marker-alt text-slate-400 mr-1"></i>高雄市苓雅區...</p>
                    </div>
                </div>
            </div>

            <!-- 新增行程按鈕 -->
            <button class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                <i class="fas fa-plus"></i>
                <span>新增此日預約</span>
            </button>
        </section>
    </main>

    <!-- 客戶注意事項彈跳視窗 (Modal) -->
    <div id="customerModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden transform scale-95 transition-transform">
            <!-- 視窗標頭 -->
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fas fa-clipboard-list text-emerald-400"></i>
                    <span>客戶備註：<span id="modalCustomerName">王小明</span></span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition text-xl"><i class="fas fa-times"></i></button>
            </div>
            <!-- 視窗內容 -->
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-xl text-xs flex items-start space-x-2">
                    <i class="fas fa-exclamation-triangle mt-0.5"></i>
                    <span>到府服務前請務必再次核對此處方與鑰匙資訊。</span>
                </div>
                <div id="modalCustomerNotes" class="text-sm text-slate-600 leading-relaxed space-y-2">
                    <!-- 動態帶入 -->
                </div>
            </div>
            <!-- 視窗底部 -->
            <div class="bg-slate-50 px-6 py-4 flex justify-end">
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 前端互動 JavaScript -->
    <script>
        // 模擬切換日期資料變更
        function selectDate(day) {
            const title = document.getElementById('selectedDateTitle');
            const list = document.getElementById('timelineList');
            const totalJobs = document.getElementById('totalJobs');
            
            title.innerText = `5 月 ${day} 日 行程詳細`;
            
            if (day === 2) {
                totalJobs.innerText = "共 2 場";
                list.innerHTML = `
                    <div class="border-l-4 border-emerald-500 bg-slate-50 p-4 rounded-r-xl shadow-xs">
                        <div class="flex justify-between items-start"><span class="text-sm font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">10:00 - 11:00</span></div>
                        <h4 class="font-bold text-base mt-2 text-slate-800">貓主：<span class="text-emerald-600 underline cursor-pointer" onclick="openModal('王小明', '貓咪：麻糬<br>🔑 鑰匙：大門地墊下密碼盒（5678）')">王小明</span></h4>
                    </div>
                    <div class="border-l-4 border-amber-500 bg-slate-50 p-4 rounded-r-xl shadow-xs">
                        <div class="flex justify-between items-start"><span class="text-sm font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">16:30 - 17:30</span></div>
                        <h4 class="font-bold text-base mt-2 text-slate-800">貓主：<span class="text-amber-600 underline cursor-pointer" onclick="openModal('林大華', '貓咪：QQ & 咪咪<br>🔑 鑰匙：大樓管理室代收')">林大華</span></h4>
                    </div>
                `;
            } else if(day === 15 || day === 20) {
                totalJobs.innerText = "共 1 場";
                list.innerHTML = `
                    <div class="border-l-4 border-indigo-500 bg-slate-50 p-4 rounded-r-xl shadow-xs">
                        <div class="flex justify-between items-start"><span class="text-sm font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">13:00 - 14:00</span></div>
                        <h4 class="font-bold text-base mt-2 text-slate-800">貓主：<span class="text-indigo-600 underline cursor-pointer" onclick="openModal('陳小姐', '貓咪：肉丸<br>🔑 鑰匙：信箱開鎖')">陳小姐</span></h4>
                    </div>
                `;
            } else {
                totalJobs.innerText = "無行程";
                list.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fas fa-calendar-minus text-4xl mb-2 block"></i>
                        <p class="text-sm">這天目前沒有排定的貓咪到府行程喔！</p>
                    </div>
                `;
            }
        }

        // 彈跳視窗控制
        function openModal(name, notes) {
            const modal = document.getElementById('customerModal');
            document.getElementById('modalCustomerName').innerText = name;
            document.getElementById('modalCustomerNotes').innerHTML = notes;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.firstElementChild.classList.remove('scale-95');
            }, 10);
        }

        // 關閉視窗
        function closeModal() {
            const modal = document.getElementById('customerModal');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }
    </script>
</body>
</html>
